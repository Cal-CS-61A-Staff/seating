name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

env:
  # Keyless auth via Workload Identity Federation; only this repository may
  # impersonate the deployer service account.
  WORKLOAD_IDENTITY_PROVIDER: projects/137456085712/locations/global/workloadIdentityPools/github/providers/berkeley-cdss
  DEPLOYER_SERVICE_ACCOUNT: seating-gh-actions-deployer@staging-cdss-web-apps.iam.gserviceaccount.com

# Fork PRs get no OIDC token, and their code shouldn't run with staging secrets,
# so previews only deploy for branches in this repository. Dependabot PRs are
# skipped too: they run their own changed workflows before review, so a bumped
# action pin would otherwise get the deployer's GCP access unreviewed.
jobs:
  cleanup-preview-service:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      # Lets google-github-actions/auth exchange GitHub's OIDC token for GCP credentials.
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Delete Cloud Run Preview Service
        run: |
          gcloud run services delete preview-seating-pr-${{ github.event.number }} \
            --region=us-west1 \
            --quiet || true

  deploy-preview-service:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets google-github-actions/auth exchange GitHub's OIDC token for GCP credentials.
      id-token: write
      # Lets the deploy job comment the preview URL on the PR.
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy to Cloud Run (Preview)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: preview-seating-pr-${{ github.event.number }}
          region: us-west1
          source: .
          flags: '--allow-unauthenticated --service-account=seating-run@staging-cdss-web-apps.iam.gserviceaccount.com --add-cloudsql-instances=staging-cdss-web-apps:us-west1:staging-cdss-web-apps-2 --max-instances=3'
          # GCP_SA_CRED_TYPE=runtime: Google Sheets are read as the account the preview runs as
          # (seating-run, set by --service-account above), so no key is stored or passed.
          # PREVIEW_PR lets the app explain that a PR adding a migration can't run as a preview.
          # RUN_MIGRATIONS is never set here: previews share the staging database.
          env_vars: |
            FLASK_APP=server.main
            FLASK_ENV=staging
            PREVIEW_PR=${{ github.event.number }}
            SERVER_BASE_URL=https://preview-seating-pr-${{ github.event.number }}-137456085712.us-west1.run.app/
            WIKI_BASE_URL=https://github.com/berkeley-cdss/seating/wiki/
            LOCAL_TIMEZONE=US/Pacific
            CANVAS_SERVER_URL=https://ucberkeley.test.instructure.com/
            MOCK_CANVAS=false
            C1C_API_DOMAIN=https://c1c-api.sait-west.berkeley.edu
            C1C_PHOTO_CACHE_LIFE=7776000
            MOCK_C1C=false
            EMAIL_SERVER=bcop.berkeley.edu
            EMAIL_PORT=587
            EMAIL_SENDER=seamless-learning@berkeley.edu
            EMAIL_USERNAME=svc-bcop-seamless-learning
            GCP_SA_CRED_TYPE=runtime
            GCP_SA_EMAIL=seating-run@staging-cdss-web-apps.iam.gserviceaccount.com
            MASTER_ROOM_SHEET_URL=https://docs.google.com/spreadsheets/d/16a1uZJl54A5_J2XpyzIBblH7LPlFCKc5Cx86CFTbZTA/edit?usp=sharing
          secrets: |
            CANVAS_CLIENT_ID=seating-canvas-client-id:latest
            CANVAS_CLIENT_SECRET=seating-canvas-client-secret:latest
            C1C_API_USERNAME=seating-c1c-api-username:latest
            C1C_API_PASSWORD=seating-c1c-api-password:latest
            C1C_PROXY_URL=seating-c1c-proxy-url:latest
            FIXIE_URL=seating-fixie-url:latest
            EMAIL_PASSWORD=seating-email-password:latest
            DATABASE_URL=seating-database-url:latest
            SECRET_KEY=seating-secret-key:latest

      - name: Allow Unauthenticated Access (allUsers)
        run: |
          gcloud run services add-iam-policy-binding preview-seating-pr-${{ github.event.number }} \
            --region=us-west1 \
            --member="allUsers" \
            --role="roles/run.invoker"

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://preview-seating-pr-${{ github.event.number }}-137456085712.us-west1.run.app
        with:
          script: |
            // The preview URL is stable for the life of the PR, so only comment once.
            const marker = '<!-- seating-pr-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (comments.some(c => c.body?.includes(marker))) {
              core.info('Preview URL already commented; skipping.');
              return;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${marker}\n🚀 **Staging Preview Deployed!**\n\nURL: ${process.env.PREVIEW_URL}`
            });
